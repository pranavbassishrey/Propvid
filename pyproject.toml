[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "propvid"
version = "0.1.0"
description = "AI Property Video Generator CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx",
    "pillow",
    "numpy",
    "imageio-ffmpeg",
    "python-dotenv",
]

[project.optional-dependencies]
tts = [
    "kokoro-onnx",
]
dev = [
    "pytest",
]

[project.scripts]
propvid = "propvid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
